server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

  # El backend NestJS no usa prefijo /api en sus rutas (/products, /auth/login,
  # /ml/webhooks/orders, etc.); nginx quita el prefijo /api/ al reenviar.
  location /api/ {
    proxy_pass http://backend:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Assets con hash en el nombre (chunk-*.js, styles-*.css): cache largo e inmutable.
  location ~* \.(?:js|css)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location ~* \.(?:png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # El service worker y su manifiesto de versión nunca deben quedar cacheados,
  # o el navegador tarda en detectar una nueva versión de la PWA.
  location ~* ^/(ngsw-worker\.js|ngsw\.json|safety-worker\.js)$ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
