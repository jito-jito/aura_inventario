<ion-content class="ion-padding">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Aura Inventario</ion-title>
    </ion-toolbar>
  </ion-header>

  <form (ngSubmit)="onSubmit()">
    <ion-item>
      <ion-label position="floating">Email</ion-label>
      <ion-input type="email" name="email" [(ngModel)]="email" required></ion-input>
    </ion-item>
    <ion-item>
      <ion-label position="floating">Contraseña</ion-label>
      <ion-input type="password" name="password" [(ngModel)]="password" required></ion-input>
    </ion-item>

    @if (errorMessage()) {
      <ion-text color="danger">
        <p>{{ errorMessage() }}</p>
      </ion-text>
    }

    <ion-button expand="block" type="submit" class="ion-margin-top" [disabled]="loading()">
      {{ loading() ? 'Ingresando...' : 'Ingresar' }}
    </ion-button>
  </form>
</ion-content>
